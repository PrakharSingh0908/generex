<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generex — Generative Art Creator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">

    <div class="logo">
      <h1>Generex</h1>
      <p class="tagline">Generative Art Creator</p>
    </div>

    <div class="controls">

      <!-- Seed -->
      <div class="control-group">
        <h3>Composition</h3>
        <div class="control">
          <label>Seed</label>
          <div class="seed-control">
            <input type="number" id="seed" value="42">
            <button id="randomSeed">Randomize</button>
          </div>
        </div>
      </div>

      <!-- Flow Field -->
      <div class="control-group">
        <h3>Flow Field</h3>
        <div class="control">
          <label>Scale <span id="scaleVal">0.003</span></label>
          <input type="range" id="scale" min="0.0005" max="0.01" step="0.0001" value="0.003">
        </div>
        <div class="control">
          <label>Complexity <span id="octavesVal">4</span></label>
          <input type="range" id="octaves" min="1" max="8" step="1" value="4">
        </div>
      </div>

      <!-- Particles -->
      <div class="control-group">
        <h3>Particles</h3>
        <div class="control">
          <label>Count <span id="countVal">10,000</span></label>
          <input type="range" id="count" min="500" max="30000" step="500" value="10000">
        </div>
        <div class="control">
          <label>Size <span id="sizeVal">1.5</span></label>
          <input type="range" id="size" min="0.3" max="4" step="0.1" value="1.5">
        </div>
        <div class="control">
          <label>Speed <span id="speedVal">1.5</span></label>
          <input type="range" id="speed" min="0.3" max="5" step="0.1" value="1.5">
        </div>
        <div class="control">
          <label>Opacity <span id="opacityVal">0.75</span></label>
          <input type="range" id="opacity" min="0.05" max="1" step="0.05" value="0.75">
        </div>
      </div>

      <!-- Trails -->
      <div class="control-group">
        <h3>Trails</h3>
        <div class="checkbox-control">
          <input type="checkbox" id="fadeTrails">
          <label for="fadeTrails">Fade trails</label>
        </div>
        <div id="fadeControls">
          <div class="control">
            <label>Fade amount <span id="fadeAmountVal">0.02</span></label>
            <input type="range" id="fadeAmount" min="0.005" max="0.1" step="0.005" value="0.02">
          </div>
        </div>
      </div>

      <!-- Colors -->
      <div class="control-group">
        <h3>Colors</h3>
        <div class="palette-selector" id="palettes"></div>
      </div>

      <!-- Canvas -->
      <div class="control-group">
        <h3>Canvas</h3>
        <div class="control">
          <label>Size</label>
          <select id="canvasSize">
            <option value="1920x1080">1920 x 1080</option>
            <option value="1080x1920">1080 x 1920</option>
            <option value="2560x1440">2560 x 1440</option>
            <option value="3840x2160">3840 x 2160</option>
            <option value="1080x1080">1080 x 1080</option>
            <option value="1200x1200">1200 x 1200</option>
          </select>
        </div>
        <div class="control">
          <label>Background</label>
          <select id="bgMode">
            <option value="black">Black</option>
            <option value="transparent">Transparent (PNG)</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="regenerate" class="btn btn-primary">Regenerate</button>
      <div class="btn-row">
        <button id="pause" class="btn btn-secondary">Pause</button>
        <button id="clear" class="btn btn-clear">Clear</button>
      </div>
      <div class="btn-row">
        <button id="exportPng" class="btn btn-export">Export PNG</button>
        <button id="exportSvg" class="btn btn-export">Export SVG</button>
      </div>
    </div>

    <div class="status">
      <span>Frames: <span id="frameCount">0</span></span>
    </div>

  </aside>

  <main class="canvas-area">
    <canvas id="canvas"></canvas>
  </main>

  <script src="js/noise.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
